name: CodexNotchCompanion
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.inathan.CodexNotchCompanion
targets:
  CodexNotchCompanion:
    type: application
    platform: macOS
    sources:
      - path: CodexNotchCompanion
        excludes:
          - "**/*.png"
    resources:
      - path: CodexNotchCompanion/Assets.xcassets
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CodexNotchCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CodexNotchCompanionTests
    dependencies:
      - target: CodexNotchCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CodexNotchCompanion:
    build:
      targets:
        CodexNotchCompanion: all
        CodexNotchCompanionTests: [test]
    test:
      targets:
        - CodexNotchCompanionTests
